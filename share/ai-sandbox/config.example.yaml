# ai-sandbox configuration file
#
# Copy this file to one of these locations:
#   ${XDG_CONFIG_HOME:-~/.config}/ai-sandbox/config.yaml   (user defaults)
#   $WORKSPACE_DIR/.ai-sandbox.yaml                         (per-project override)
#
# All fields are optional. Uncomment and edit the values you want to change.
# Precedence per knob: env var > workspace config > user config > built-in default.

# Coding agent to run. Supported values: claude, codex, opencode.
# Default: claude.
# tool: opencode

claude:
  # Claude Code version to run inside the container.
  # Default: host's claude version (from `claude --version`).
  # version: "2.1.152"

  # When false, host ~/.claude and ~/.claude.json are not mounted into
  # the container. Useful with ANTHROPIC_API_KEY for a more isolated
  # environment. Default: true.
  # config_passthrough: true

  # Custom host paths for the Claude config directory and file.
  # The container-side path is always ${SANDBOX_HOME}/.claude and
  # ${SANDBOX_HOME}/.claude.json (that's where Claude Code expects them);
  # only the host-side path is configurable.
  # Default: ~/.claude and ~/.claude.json respectively.
  # config_dir: /path/to/custom/.claude
  # config_file: /path/to/custom/.claude.json

codex:
  # Codex CLI version to run inside the container.
  # Default: host's codex version; npm's latest when codex is not installed.
  # version: "1.2.3"

  # When false, the host Codex config directory is not mounted.
  # Use OPENAI_API_KEY for authentication without host config. Default: true.
  # config_passthrough: true

  # Custom host path mounted at ${SANDBOX_HOME}/.codex.
  # Default: ~/.codex.
  # config_dir: /path/to/custom/.codex

opencode:
  # OpenCode version to run inside the container.
  # Default: host's opencode version; npm's latest when opencode is not installed.
  # version: "0.6.9"

  # When false, host ~/.config/opencode (opencode.json, agents, themes)
  # is not mounted. Default: true.
  # config_passthrough: true

  # When false, host ~/.local/share/opencode (auth.json credentials and
  # session data) is not mounted. Use OPENAI_API_KEY / ANTHROPIC_API_KEY
  # for authentication without host auth. Default: true.
  # data_passthrough: true

  # Custom host paths mounted at ${SANDBOX_HOME}/.config/opencode and
  # ${SANDBOX_HOME}/.local/share/opencode respectively.
  # Default: ~/.config/opencode and ~/.local/share/opencode.
  # config_dir: /path/to/custom/.config/opencode
  # data_dir: /path/to/custom/.local/share/opencode

proxy:
  # Forward non-empty HTTP_PROXY, HTTPS_PROXY, ALL_PROXY, NO_PROXY and
  # their lowercase equivalents from the host into the sandbox. This
  # configures proxy-aware clients, including npx, Claude, and Codex.
  # Set false if proxy URLs contain credentials you do not want exposed
  # inside the container. Default: true.
  # env_passthrough: true

mounts:
  # Extra passthrough mounts: arbitrary host paths mounted into the sandbox in
  # addition to the well-known tool config dirs (~/.claude, ~/.codex, ...).
  # Useful when a helper tool keeps its own config elsewhere and the agent must
  # see it - for example CC Switch's settings directory so a switched Claude
  # profile resolves its configs inside the sandbox.
  #
  # Each entry is a spec: HOST[:CONTAINER[:FLAGS]]
  #   - CONTAINER defaults to the (same) expanded HOST path, which lines up
  #     when the sandbox home mirrors the host home (the default). Set it
  #     explicitly to mount somewhere else.
  #   - FLAGS defaults to "ro" (read-only safety default); use ":rw" to allow
  #     writes from inside the sandbox.
  #   - A leading "~" / "~/" in either path expands to the host $HOME.
  #
  # Env override: SANDBOX_EXTRA_MOUNTS (newline-separated specs).
  # When enabled: false, ALL mounts (manual extra + auto-detected) are ignored.
  # Default: true.
  # enabled: true
  # extra:
  #   - "~/.config/cc-switch"                                 # read-only, same path
  #   - "~/.cache/npm:/home/user/.cache/npm:rw"               # explicit dest + rw
  #   - "/shared/creds:/opt/creds:ro"
  #
  # Automatic mount detection (only triggers when the situation exists):
  #   git_worktree: when the workspace is a linked git worktree or submodule,
  #     mount the worktree's git-dir (its ".git" file's gitdir target) AND the
  #     COMMON git dir (objects/refs) read-write so git behaves as on the host.
  #     For a submodule the gitdir target is itself the common dir (single mount).
  #     Default: true.
  #   symlinks: within the selected tool's mounted config dir, mount read-only
  #     the canonical target of any symlink that resolves OUTSIDE those dirs,
  #     so e.g. a skill shared from elsewhere is usable instead of dangling.
  #     Default: true.
  # Env overrides: SANDBOX_AUTO_GIT_WORKTREE, SANDBOX_AUTO_SYMLINKS.
  # auto:
  #   git_worktree: true
  #   symlinks: true

browser:
  # Let the sandboxed agent drive a browser that runs ON THE HOST and is
  # visible/interactive for the user. The agent connects to a Playwright MCP
  # server started by a systemd user service (`ai-sandbox-playwright`);
  # host networking makes it reachable at 127.0.0.1 from inside. When enabled,
  # the launcher passes PLAYWRIGHT_MCP_URL and, for Claude, registers the MCP
  # server automatically. The browser is only launched when the agent drives it.
  #
  # The host-side service prefers a system browser (chromium/chrome, then
  # firefox), validating it headlessly at startup; if none is usable it falls
  # back to Playwright's own bundled chromium, auto-installing it on first need.
  # It also auto-detects the display (Wayland vs X11), so no DISPLAY wrangling
  # is needed. Set PLAYWRIGHT_MCP_HEADLESS=true in the systemd unit for headless.
  # Default: false.
  # enabled: true
  # URL of the host-side Playwright MCP endpoint. Default: http://127.0.0.1:8931/mcp
  # mcp_url: http://127.0.0.1:8931/mcp

progress:
  # Startup progress display. While the sandbox prepares (config resolution,
  # mount detection, tool package warm-up), the launcher shows a single
  # self-erasing progress line (spinner with elapsed time on a terminal, one
  # static line per phase otherwise) instead of falling silent after the
  # docker compose messages. Enabling it also runs a short non-interactive
  # cache warm-up container first, so the (potentially slow) tool package
  # download happens under the progress line instead of silently inside the
  # interactive session. The warm-up container runs on every enabled launch
  # (a cached package makes it quick, but it still costs one extra short-lived
  # container start); the download itself only happens on first launch or when
  # the pinned version changes. Set false to restore the fully silent legacy
  # behavior (no progress line, no warm-up container).
  # Env override: SANDBOX_PROGRESS.
  # Default: true.
  # enabled: true

sandbox:
  # uid: 1000          # default: $(id -u)
  # gid: 1000          # default: $(id -g)
  # username: ryey     # default: $(id -un)
  # home: /home/ryey   # default: /home/$username

  # When false, the cleanup container that removes empty stub dirs
  # does not run. Stubs are harmless; this only saves one quick
  # container startup. Default: true.
  # cleanup: true

git:
  # Identity overrides applied via GIT_AUTHOR_NAME / GIT_COMMITTER_NAME /
  # GIT_AUTHOR_EMAIL / GIT_COMMITTER_EMAIL env vars inside the container.
  # When unset, git uses whatever user.name / user.email it finds in the
  # container (from host_config_passthrough or git's defaults).
  #
  # Note: `git config user.name` (the command) ignores these env vars - it
  # reads config files only. Commits are still authored correctly; only
  # introspection via `git config` is affected. `git var GIT_AUTHOR_IDENT`
  # is the one command that does respect the env vars.
  identity:
    # name: claude-bot
    # email: bot@example.com
  # When false, host ~/.gitconfig and ~/.config/git/ are not mounted into
  # the container. Default: true (preserves host git identity inheritance).
  # host_config_passthrough: true

  # When true, the wrapper blocks only git push and allows all local
  # operations unconditionally (reset --hard, commit --amend, branch -D,
  # config, rebase, etc.). User policy.allow/block rules are ignored.
  # Useful for quick override from the command line: --allow-local-git.
  # Default: false.
  # allow_local_operations: false

  # User-defined git operation policy. Regex patterns (ERE) matched against
  # the git subcommand + args (global flags like -C are stripped first).
  # Substring match by default; use ^ and $ to anchor.
  #
  # allow: overrides the default block list below. If a pattern matches,
  #        the command runs even if the default would block it.
  # block: adds to the default block list. If a pattern matches, the
  #        command is blocked even if the default allows it.
  #
  # The effective policy can be inspected inside the container:
  #   cat /etc/ai-sandbox/git-policy.conf
  #
  # Default policy (built-in, for reference):
  #   Fully blocked subcommands:
  #     push, reset, rebase, filter-branch, filter-repo, clean, config
  #   Conditionally blocked (sub-subcommand or flag):
  #     reflog expire|delete
  #     notes remove|prune
  #     worktree remove|prune
  #     stash drop|clear
  #     branch -d|-D|--delete
  #     tag -d|--delete|-f|--force
  #     commit --amend|--reset-author
  #     checkout -B|-f|--force|-- <pathspec>
  #     switch -C|--discard-changes
  #     restore --worktree|-W
  #     rm (without --cached)
  #     gc --prune
  #   Everything else is allowed.
  policy:
    allow:
      # - "^reset"           # allow all reset forms (--hard, --soft, etc.)
      # - "^commit --amend"  # allow amend
    block:
      # - "^stash pop"       # example: block stash pop
