services:
  # The AI Sandboxed Runtime
  ai-agent:
    image: node:22-bookworm
    environment:
      - IS_SANDBOX=1  # Signals that the agent runs inside the external sandbox
    volumes:
      # 1. DYNAMIC MOUNT: Injected dynamically by the wrapper launcher.
      #    Mounted at its exact host path so the selected agent sees the same host path.
      - ${WORKSPACE_DIR}:${WORKSPACE_DIR}
      # 2. PERSISTENT CACHE: Saves manual tools, packages, global settings, and histories
      - ai-agent-home:${SANDBOX_HOME}
      # 3. SELECTED-TOOL CONFIG PASS-THROUGH: Injected dynamically by the launcher
      #    (TOOL_VOLUME_ARGS) so it can be toggled via config.
      #    See bin/ai-sandbox for the conditional mount logic.
      # 4. GIT WRAPPER: Intercepts git calls to block destructive operations.
      #    Read-only; /usr/local/bin precedes /usr/bin in PATH inside node:22-bookworm.
      - ./git-wrapper:/usr/local/bin/git:ro
    working_dir: ${WORKSPACE_DIR}
    tty: true
    stdin_open: true
    # NOTE: host network mode is used for simplicity (e.g. accessing host proxy at 127.0.0.1:7890).
    # This means the container shares the host's network namespace — there is currently NO network
    # isolation. Improving network isolation is a future goal; see docs/architecture.md.
    network_mode: host
    # This runs once on startup to:
    #   1. Create the target user/group (mirroring host UID/GID) so exec'd processes own their files.
    #   2. Block git pushes globally across all workspaces.
    # Uses /usr/bin/git (not git) for config --system: the wrapper at /usr/local/bin/git blocks
    # the config subcommand, which would break the && chain and skip the runuser step (running as root).
    entrypoint: >
      sh -c "
      if [ '${SANDBOX_UID}' != '0' ]; then
      getent group ${SANDBOX_GID} >/dev/null 2>&1 || groupadd -g ${SANDBOX_GID} ${SANDBOX_USERNAME};
      getent passwd ${SANDBOX_UID} >/dev/null 2>&1 || useradd -u ${SANDBOX_UID} -g ${SANDBOX_GID} -d ${SANDBOX_HOME} -s /bin/bash -M ${SANDBOX_USERNAME};
      mkdir -p ${SANDBOX_HOME} && chown ${SANDBOX_UID}:${SANDBOX_GID} ${SANDBOX_HOME};
      fi &&
      /usr/bin/git config --system core.sshCommand 'echo \"[SECURITY] Remote push operations are prohibited inside this sandbox.\" && false' &&
      /usr/bin/git config --system url.'https://prohibited/'.insteadOf 'https://github.com/' &&
      /usr/bin/git config --system url.'https://prohibited/'.insteadOf 'git@github.com:' &&
      [ '${SANDBOX_UID}' != '0' ] && exec runuser -u ${SANDBOX_USERNAME} -- \"$$@\" || exec \"$$@\"
      " --

  # Removes empty stub directories that Docker created inside the ai-agent-home volume
  # as mount-point parents for WORKSPACE_DIR. Run after the ai-agent container exits.
  cleanup:
    image: busybox
    volumes:
      - ai-agent-home:${SANDBOX_HOME}
    environment:
      - SANDBOX_HOME
      - WORKSPACE_DIR
    entrypoint: >
      sh -c "
      _dir=$$(dirname \"$$WORKSPACE_DIR\");
      while [ \"$$_dir\" != \"$$SANDBOX_HOME\" ] && [ \"$$_dir\" != '/' ]; do
        rmdir \"$$_dir\" 2>/dev/null || break;
        _dir=$$(dirname \"$$_dir\");
      done
      "

volumes:
  ai-agent-home:
